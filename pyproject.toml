[project]
name = "izy"
version = "0.1.0"
description = "Local-first desktop focus companion"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
izy = "izy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["izy"]

# The whole suite must run offline with no API key set — tests/conftest.py
# unsets ANTHROPIC_API_KEY and no test touches the network, D-Bus or the real
# ~/.local/share/izy database.
[tool.pytest.ini_options]
testpaths = ["tests"]
